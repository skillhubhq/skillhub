syntax = "proto3";
package api.community.v1;

import "api/catalog/v1/catalog_service.proto";
import "api/common/v1/types.proto";
import "buf/validate/validate.proto";
import "common/registry/v1/taxonomy.proto";
import "google/protobuf/timestamp.proto";
// CommunityService 提供受发布受众约束的身份、团队与社区互动。
service CommunityService {
  // RemoveBookmark 即使技能不可访问也允许移除本人的收藏。
  rpc RemoveBookmark(RemoveBookmarkRequest) returns (RemoveBookmarkResponse);
  // GetParticipation 返回当前用户的投稿空间和模式配额。
  rpc GetParticipation(GetParticipationRequest) returns (GetParticipationResponse);
  // ReportContent 举报当前可访问的已发布版本或评论。
  rpc ReportContent(ReportContentRequest) returns (ReportContentResponse);
  // ListReports 仅管理员读取举报队列和处理结果。
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);
  // ResolveReport 原子处理举报与对应内容，保留审计。
  rpc ResolveReport(ResolveReportRequest) returns (ResolveReportResponse);
  // UpdateAvatar 上传或移除当前用户的头像，由 Hub 规范化图片。
  rpc UpdateAvatar(UpdateAvatarRequest) returns (UpdateAvatarResponse);
  // GetProfile 按当前主体权限执行社区操作。
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // UpdateProfile 按当前主体权限执行社区操作。
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // GetTeam 按当前主体权限执行社区操作。
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  // UpdateTeam 按当前主体权限执行社区操作。
  rpc UpdateTeam(UpdateTeamRequest) returns (UpdateTeamResponse);
  // ListTeams 按当前主体权限执行社区操作。
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  // ListMembers 按当前主体权限执行社区操作。
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // ListContributions 按当前主体权限执行社区操作。
  rpc ListContributions(ListContributionsRequest) returns (ListContributionsResponse);
  // GetDiscussion 按当前主体权限执行社区操作。
  rpc GetDiscussion(GetDiscussionRequest) returns (GetDiscussionResponse);
  // ListComments 按当前主体权限执行社区操作。
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  // CreateComment 按当前主体权限执行社区操作。
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  // DeleteComment 按当前主体权限执行社区操作。
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  // SetReaction 按当前主体权限执行社区操作。
  rpc SetReaction(SetReactionRequest) returns (SetReactionResponse);
  // ListBookmarks 按当前主体权限执行社区操作。
  rpc ListBookmarks(ListBookmarksRequest) returns (ListBookmarksResponse);
}
// Profile 为社区资源的传输投影。
message Profile {
  // user_id 表示本次操作的对应属性。
  string user_id = 1;
  // username 表示本次操作的对应属性。
  string username = 2;
  // display_name 表示本次操作的对应属性。
  string display_name = 3;
  // bio 表示本次操作的对应属性。
  string bio = 4;
  // revision 表示本次操作的对应属性。
  uint64 revision = 5;
  // can_edit 表示本次操作的对应属性。
  bool can_edit = 6;
  // avatar 为 Hub 规范化后的 PNG data URL；空值使用首字母。
  string avatar = 7;
}
// Team 为社区资源的传输投影。
message Team {
  // namespace 表示本次操作的对应属性。
  string namespace = 1;
  // display_name 表示本次操作的对应属性。
  string display_name = 2;
  // bio 表示本次操作的对应属性。
  string bio = 3;
  // revision 表示本次操作的对应属性。
  uint64 revision = 4;
  // can_edit 表示本次操作的对应属性。
  bool can_edit = 5;
  // can_view_members 表示本次操作的对应属性。
  bool can_view_members = 6;
}
// Member 为社区资源的传输投影。
message Member {
  // profile 表示本次操作的对应属性。
  Profile profile = 1;
  // roles 表示本次操作的对应属性。
  repeated .common.registry.v1.NamespaceRole roles = 2;
}
// Contribution 为社区资源的传输投影。
message Contribution {
  // release_id 表示本次操作的对应属性。
  string release_id = 1;
  // namespace 表示本次操作的对应属性。
  string namespace = 2;
  // name 表示本次操作的对应属性。
  string name = 3;
  // version 表示本次操作的对应属性。
  string version = 4;
  // description 表示本次操作的对应属性。
  string description = 5;
  // author 表示本次操作的对应属性。
  Profile author = 6;
  // 英文展示名称；为空时使用另一语言或稳定名称。
  string display_name_en = 7;
  // 简体中文展示名称。
  string display_name_zh = 8;
  // 内置技能图标；零值使用默认图标。
  .common.registry.v1.SkillIcon icon = 9;
  // 上游署名；author 字段仍为实际提交账号的公开资料。
  api.catalog.v1.Provenance provenance = 10;
  // 收藏的技能当前不可访问。
  bool unavailable = 11;
}
// Comment 为社区资源的传输投影。
message Comment {
  // comment_id 表示本次操作的对应属性。
  string comment_id = 1;
  // release_id 表示本次操作的对应属性。
  string release_id = 2;
  // parent_id 表示本次操作的对应属性。
  string parent_id = 3;
  // author 表示本次操作的对应属性。
  Profile author = 4;
  // body 表示本次操作的对应属性。
  string body = 5;
  // created_at 表示本次操作的对应属性。
  google.protobuf.Timestamp created_at = 6;
  // deleted 表示本次操作的对应属性。
  bool deleted = 7;
  // can_delete 表示本次操作的对应属性。
  bool can_delete = 8;
  // 评论所讨论的内容版本。
  string version = 9;
}
// Discussion 为社区资源的传输投影。
message Discussion {
  // like_count 表示本次操作的对应属性。
  uint64 like_count = 1;
  // comment_count 表示本次操作的对应属性。
  uint64 comment_count = 2;
  // liked 表示本次操作的对应属性。
  bool liked = 3;
  // bookmarked 表示本次操作的对应属性。
  bool bookmarked = 4;
  // can_interact 表示本次操作的对应属性。
  bool can_interact = 5;
}
// GetProfileRequest 为社区资源的传输投影。
message GetProfileRequest {
  // user_id 表示本次操作的对应属性。
  string user_id = 1 [(buf.validate.field).string.max_len = 128];
}
// GetProfileResponse 为社区资源的传输投影。
message GetProfileResponse {
  // profile 表示本次操作的对应属性。
  Profile profile = 1;
}
// UpdateProfileRequest 为社区资源的传输投影。
message UpdateProfileRequest {
  // mutation 表示本次操作的对应属性。
  api.common.v1.Mutation mutation = 1 [(buf.validate.field).required = true];
  // display_name 表示本次操作的对应属性。
  string display_name = 2 [(buf.validate.field).string.max_len = 80];
  // bio 表示本次操作的对应属性。
  string bio = 3 [(buf.validate.field).string.max_len = 600];
  // expected_revision 表示本次操作的对应属性。
  uint64 expected_revision = 4;
}
// UpdateProfileResponse 为社区资源的传输投影。
message UpdateProfileResponse {
  // profile 表示本次操作的对应属性。
  Profile profile = 1;
}
// GetTeamRequest 为社区资源的传输投影。
message GetTeamRequest {
  // namespace 表示本次操作的对应属性。
  string namespace = 1 [(buf.validate.field).string.max_len = 128];
}
// GetTeamResponse 为社区资源的传输投影。
message GetTeamResponse {
  // team 表示本次操作的对应属性。
  Team team = 1;
}
// UpdateTeamRequest 为社区资源的传输投影。
message UpdateTeamRequest {
  // mutation 表示本次操作的对应属性。
  api.common.v1.Mutation mutation = 1 [(buf.validate.field).required = true];
  // namespace 表示本次操作的对应属性。
  string namespace = 2 [(buf.validate.field).string.max_len = 128];
  // display_name 表示本次操作的对应属性。
  string display_name = 3 [(buf.validate.field).string.max_len = 80];
  // bio 表示本次操作的对应属性。
  string bio = 4 [(buf.validate.field).string.max_len = 600];
  // expected_revision 表示本次操作的对应属性。
  uint64 expected_revision = 5;
}
// UpdateTeamResponse 为社区资源的传输投影。
message UpdateTeamResponse {
  // team 表示本次操作的对应属性。
  Team team = 1;
}
// ListTeamsRequest 为社区资源的传输投影。
message ListTeamsRequest {
  // page 表示本次操作的对应属性。
  api.common.v1.PageRequest page = 1;
}
// ListTeamsResponse 为社区资源的传输投影。
message ListTeamsResponse {
  // teams 表示本次操作的对应属性。
  repeated Team teams = 1;
  // page 表示本次操作的对应属性。
  api.common.v1.PageResult page = 2;
}
// ListMembersRequest 为社区资源的传输投影。
message ListMembersRequest {
  // namespace 表示本次操作的对应属性。
  string namespace = 1 [(buf.validate.field).string.max_len = 128];
  // page 表示本次操作的对应属性。
  api.common.v1.PageRequest page = 2;
}
// ListMembersResponse 为社区资源的传输投影。
message ListMembersResponse {
  // members 表示本次操作的对应属性。
  repeated Member members = 1;
  // page 表示本次操作的对应属性。
  api.common.v1.PageResult page = 2;
}
// ListContributionsRequest 为社区资源的传输投影。
message ListContributionsRequest {
  // user_id 表示本次操作的对应属性。
  string user_id = 1 [(buf.validate.field).string.max_len = 128];
  // namespace 表示本次操作的对应属性。
  string namespace = 2 [(buf.validate.field).string.max_len = 128];
  // page 表示本次操作的对应属性。
  api.common.v1.PageRequest page = 3;
}
// ListContributionsResponse 为社区资源的传输投影。
message ListContributionsResponse {
  // contributions 表示本次操作的对应属性。
  repeated Contribution contributions = 1;
  // page 表示本次操作的对应属性。
  api.common.v1.PageResult page = 2;
}
// GetDiscussionRequest 为社区资源的传输投影。
message GetDiscussionRequest {
  // release_id 表示本次操作的对应属性。
  string release_id = 1 [(buf.validate.field).string.max_len = 128];
}
// GetDiscussionResponse 为社区资源的传输投影。
message GetDiscussionResponse {
  // discussion 表示本次操作的对应属性。
  Discussion discussion = 1;
}
// ListCommentsRequest 为社区资源的传输投影。
message ListCommentsRequest {
  // release_id 表示本次操作的对应属性。
  string release_id = 1 [(buf.validate.field).string.max_len = 128];
  // parent_id 表示本次操作的对应属性。
  string parent_id = 2 [(buf.validate.field).string.max_len = 128];
  // page 表示本次操作的对应属性。
  api.common.v1.PageRequest page = 3;
}
// ListCommentsResponse 为社区资源的传输投影。
message ListCommentsResponse {
  // comments 表示本次操作的对应属性。
  repeated Comment comments = 1;
  // page 表示本次操作的对应属性。
  api.common.v1.PageResult page = 2;
}
// CreateCommentRequest 为社区资源的传输投影。
message CreateCommentRequest {
  // mutation 表示本次操作的对应属性。
  api.common.v1.Mutation mutation = 1 [(buf.validate.field).required = true];
  // release_id 表示本次操作的对应属性。
  string release_id = 2 [(buf.validate.field).string.max_len = 128];
  // parent_id 表示本次操作的对应属性。
  string parent_id = 3 [(buf.validate.field).string.max_len = 128];
  // body 表示本次操作的对应属性。
  string body = 4 [(buf.validate.field).string.max_len = 4000];
}
// CreateCommentResponse 为社区资源的传输投影。
message CreateCommentResponse {
  // comment 表示本次操作的对应属性。
  Comment comment = 1;
}
// DeleteCommentRequest 为社区资源的传输投影。
message DeleteCommentRequest {
  // mutation 表示本次操作的对应属性。
  api.common.v1.Mutation mutation = 1 [(buf.validate.field).required = true];
  // comment_id 表示本次操作的对应属性。
  string comment_id = 2 [(buf.validate.field).string.max_len = 128];
}
// DeleteCommentResponse 为社区资源的传输投影。
message DeleteCommentResponse {}
// SetReactionRequest 为社区资源的传输投影。
message SetReactionRequest {
  // mutation 表示本次操作的对应属性。
  api.common.v1.Mutation mutation = 1 [(buf.validate.field).required = true];
  // release_id 表示本次操作的对应属性。
  string release_id = 2 [(buf.validate.field).string.max_len = 128];
  // bookmark 表示本次操作的对应属性。
  bool bookmark = 3;
  // active 表示本次操作的对应属性。
  bool active = 4;
}
// SetReactionResponse 为社区资源的传输投影。
message SetReactionResponse {
  // discussion 表示本次操作的对应属性。
  Discussion discussion = 1;
}
// ListBookmarksRequest 为社区资源的传输投影。
message ListBookmarksRequest {
  // page 表示本次操作的对应属性。
  api.common.v1.PageRequest page = 1;
}
// ListBookmarksResponse 为社区资源的传输投影。
message ListBookmarksResponse {
  // contributions 表示本次操作的对应属性。
  repeated Contribution contributions = 1;
  // page 表示本次操作的对应属性。
  api.common.v1.PageResult page = 2;
}

// UpdateAvatarRequest 更新当前用户头像；空图片移除头像。
message UpdateAvatarRequest {
  // mutation 绑定重试请求。
  api.common.v1.Mutation mutation = 1 [(buf.validate.field).required = true];
  // image 为最多 512 KiB 的 PNG 或 JPEG 图片。
  bytes image = 2 [(buf.validate.field).bytes.max_len = 524288];
  // expected_revision 防止覆盖并发资料修改。
  uint64 expected_revision = 3;
}
// UpdateAvatarResponse 返回规范化的个人资料。
message UpdateAvatarResponse {
  // profile 包含更新后的头像和修订号。
  Profile profile = 1;
}

// GetParticipationRequest 查询当前账号，不接受任意用户标识。
message GetParticipationRequest {}
// GetParticipationResponse 描述当前 Hub 的策略和当前账号计量。
message GetParticipationResponse {
  // 是否启用社区准入和投稿策略。
  bool community_mode = 1;
  // 当前账号个人空间；企业模式或未创建时为空。
  string personal_namespace = 2;
  // 当前账号累计版本数，含撤下和拒绝版本。
  uint64 versions = 3;
  // 社区模式的账号版本上限。
  uint64 version_limit = 4;
  // 按版本累计压缩包字节数。
  uint64 storage_bytes = 5;
  // 社区模式的账号存储上限。
  uint64 storage_limit = 6;
  // 最近二十四小时投稿数。
  uint64 submissions_today = 7;
  // 社区模式每日投稿上限。
  uint64 submission_limit = 8;
}
// ReportContentRequest 不接受目标用户或任意 URL。
message ReportContentRequest {
  // 幂等写入标识。
  api.common.v1.Mutation mutation = 1 [(buf.validate.field).required = true];
  // 可访问的版本。
  string release_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // 举报评论时填写，必须属于同一版本。
  string comment_id = 3 [(buf.validate.field).string.max_len = 128];
  // 具体问题，不含凭据或个人秘密。
  string reason = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
}
// ReportContentResponse 仅返回受理编号。
message ReportContentResponse {
  // 举报编号。
  string id = 1;
}
// ContentReport 仅向管理员展示举报人和目标信息。
message ContentReport {
  // 举报编号。
  string id = 1;
  // 举报人账号标识。
  string reporter = 2;
  // 目标版本。
  string release_id = 3;
  // 可选评论标识。
  string comment_id = 4;
  // 举报说明。
  string reason = 5;
  // 是否已处理。
  bool resolved = 6;
  // 处理说明。
  string resolution = 7;
  // 受理时间。
  google.protobuf.Timestamp created_at = 8;
  // 处理时间。
  google.protobuf.Timestamp resolved_at = 9;
  // 稳定技能坐标。
  string coordinate = 10;
  // 目标当前正文摘要；已删除评论不返回旧正文。
  string content = 11;
}
// ListReportsRequest 以服务端游标读取待处理或已处理集合。
message ListReportsRequest {
  // 分页参数。
  api.common.v1.PageRequest page = 1;
  // 是否查看已处理记录。
  bool resolved = 2;
}
// ListReportsResponse 返回管理员可见的举报队列。
message ListReportsResponse {
  // 举报记录。
  repeated ContentReport reports = 1;
  // 后续游标。
  api.common.v1.PageResult page = 2;
}
// ResolveReportRequest 处理动作由服务端重新校验。
message ResolveReportRequest {
  // 幂等写入标识。
  api.common.v1.Mutation mutation = 1 [(buf.validate.field).required = true];
  // 举报编号。
  string id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // 明确处理动作。
  .common.registry.v1.ReportResolution action = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // 对管理员保留的处理依据。
  string note = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
}
// ResolveReportResponse 表示处理已提交。
message ResolveReportResponse {}

// RemoveBookmarkRequest 按稳定技能身份移除收藏。
message RemoveBookmarkRequest {
  // 幂等请求。
  .api.common.v1.Mutation mutation = 1;
  // 团队名称。
  string namespace = 2;
  // 技能名称。
  string name = 3;
}
// RemoveBookmarkResponse 表示移除已完成。
message RemoveBookmarkResponse {}
