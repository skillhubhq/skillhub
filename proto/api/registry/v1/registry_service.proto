syntax = "proto3";

package api.registry.v1;

// RegistryService 提供连接前可读取的实例能力。
service RegistryService {
  // GetRegistry 返回稳定实例身份和协议能力。
  rpc GetRegistry(GetRegistryRequest) returns (GetRegistryResponse);
}

// GetRegistryRequest 无需提供账号。
message GetRegistryRequest {}

// GetRegistryResponse 描述当前实例而非全球目录。
message GetRegistryResponse {
  // 实例初始化生成且持久化的标识。
  string registry_id = 1;
  // 实例显示名称。
  string display_name = 2;
  // 当前协议主版本。
  uint32 protocol_major = 3;
  // 是否要求全部目录读取通过身份验证。
  bool private_mode = 4;
  // 客户端可探测的功能标识。
  repeated string capabilities = 5;
  // 接收的最大压缩包字节数。
  uint64 max_package_bytes = 6;
  // 社区模式采用自动准入、个人空间和强制独立审核。
  bool community_mode = 7;
  // 部署方隐私说明地址。
  string privacy_url = 8;
  // 部署方服务条款地址。
  string terms_url = 9;
  // 部署方联系地址。
  string contact_url = 10;
  // 部署方公开备案文本。
  string filing_text = 11;
  // 对应备案信息链接。
  string filing_url = 12;
}
